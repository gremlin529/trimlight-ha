turn_off_in:
  target:
    entity:
      integration: trimlight
      domain: light
  fields:
    minutes:
      required: true
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
turn_off_at:
  target:
    entity:
      integration: trimlight
      domain: light
  fields:
    time:
      required: true
      example: "22:00"
      selector:
        time:
cancel_off_timer:
  target:
    entity:
      integration: trimlight
      domain: light
